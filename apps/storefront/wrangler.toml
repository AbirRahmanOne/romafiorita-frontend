# Storefront → Cloudflare Workers via the OpenNext adapter.
# Build with `pnpm --filter storefront build:cf`, deploy with `... deploy`.
# Real env values live in the Cloudflare dashboard / `wrangler secret`, never here.
name = "romafiorita-storefront"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_USE_MOCKS = "false"
